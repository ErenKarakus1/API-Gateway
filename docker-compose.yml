services:
  gateway:
    build: .
    environment:
      CONFIG_PATH: /app/config/gateway.compose.yaml
    ports:
      - "8080:8080"
    depends_on:
      users-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  users-service:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      SERVICE_NAME: users-service
      PORT: "9001"
    expose:
      - "9001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
